display_information:
  name: Teaching AI Agents
  description: Local acquisition research and audit assistant
  background_color: "#0d192b"
features:
  bot_user:
    display_name: Teaching AI Agents
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - files:read
      - im:history
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - file_shared
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
