version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
    # LM Studio runs natively on the host, not in a container (GPU passthrough
    # is unreliable across mixed hardware). Backend reaches it via
    # host.docker.internal:<port> — see docs/project-architecture-plan.md section 5.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-teaching_ai_agents}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # nanobot:
  #   Sandboxed Task Execution Agent. Pulled from its own repo per its install
  #   instructions (see docs/project-architecture-plan.md section 12) and wired
  #   in here as a separate service once that setup is done.

volumes:
  pgdata:
